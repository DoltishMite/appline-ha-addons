name: Netline Agent
version: "2.6.7"
slug: netline_agent
description: Makes Home Assistant a Netline node - devices on your network, connection health, speed tests and uptime checks
url: https://github.com/DoltishMite/appline-ha-addons/tree/main/netline_agent
arch:
  - aarch64
  - amd64
init: false
startup: services
# it scans and pings your home network, so it needs the host's network and raw sockets (ping)
host_network: true
privileged:
  - NET_RAW
# 🛡 Patches in Netline: it lists Home Assistant's updates (Core, OS, Supervisor, add-ons) and installs the ones you pick there,
# through the Supervisor; that needs its manager role (Home Assistant shows the add-on's rating one point lower for it)
hassio_api: true
hassio_role: manager
# ⟳ Update from Netline: it asks Home Assistant to install its own update (an add-on can't ask the Supervisor for that itself);
# this doesn't change the rating
homeassistant_api: true
options:
  sync_code: null
  name: Home Assistant
schema:
  sync_code: password
  name: str(1,40)
