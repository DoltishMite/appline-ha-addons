name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./netline_agent"

  build:
    # the image as Home Assistant builds it, for each architecture, then the agent's self-test inside it
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          VERSION=$(grep '^version:' netline_agent/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          docker buildx build --platform ${{ matrix.platform }} --load -t netline-test \
            --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION="$VERSION" netline_agent
      - name: Self-test inside the image
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint /usr/local/bin/NetlineAgent netline-test --hours-test
          docker run --rm --platform ${{ matrix.platform }} -e XDG_CONFIG_HOME=/tmp -e DOTNET_BUNDLE_EXTRACT_BASE_DIR=/tmp/netline \
            --entrypoint /usr/local/bin/NetlineAgent netline-test status
